name: CI

on: [push, pull_request]

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']


    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@2.32.0
      with:
        php-version: ${{ matrix.php }}
        ini-values: xdebug.max_nesting_level=3000

    - name: Build ext-encoding
      run: |
        git clone --depth=1 https://github.com/pmmp/ext-encoding.git /tmp/ext-encoding
        cd /tmp/ext-encoding
        phpize
        ./configure
        make -j$(nproc)
        sudo make install
        echo "extension=encoding" | sudo tee -a "$(php -r 'echo php_ini_loaded_file();')"

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: "~/.cache/composer"
        key: "php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}"
        restore-keys: "php-${{ matrix.php }}-composer-"

    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction

    - name: Run PHPStan
      run: ./vendor/bin/phpstan analyze --no-progress

    - name: Run PHPUnit
      run: ./vendor/bin/phpunit --bootstrap vendor/autoload.php --fail-on-warning tests/phpunit
